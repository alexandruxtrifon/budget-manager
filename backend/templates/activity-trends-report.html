<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity Trends Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #fff; color: #222; }
    .header { background: #2d3748; color: #fff; padding: 24px; text-align: center; }
    .section { margin: 32px; }
    .summary { margin-bottom: 24px; }
    .chart-container { width: 100%; max-width: 700px; margin: 0 auto 32px auto; }
    .footer { text-align: center; color: #888; font-size: 12px; margin-top: 40px; }
    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f7fafc; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Activity Trends Report</h1>
    <div>{{userName}}</div>
    <div>{{date}}</div>
    <div>Timeframe: {{timeframe}}</div>
  </div>
  <div class="section">
    <div class="summary">
      <h2>Summary</h2>
      <p>{{summary}}</p>
    </div>
    <div class="chart-container">
      <canvas id="activityTrendsChart" width="700" height="350"></canvas>
    </div>
    <div>
      <h2>Details</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Activity Count</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody>
          {{#each activityData}}
            <tr>
              <td>{{this.date}}</td>
              <td>{{this.count}}</td>
              <td>{{this.type}}</td>
            </tr>
          {{/each}}
        </tbody>
      </table>
    </div>
  </div>
  <div class="footer">
    Generated by Budget Manager &mdash; {{date}}
  </div>
  <script>
    {{{chartJsLib}}}
    const chartData = {{{activityTrendsChartData}}};
    const ctx = document.getElementById('activityTrendsChart').getContext('2d');
    new Chart(ctx, chartData);
  </script>
</body>
</html>
